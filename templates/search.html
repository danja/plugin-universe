<form method="get" action="/search" class="searchbar">
  <div class="search-row">
    <label for="q" class="visually-hidden">Search for a plugin</label>
    <input type="search" id="q" name="q" value="{{query}}" placeholder="warm analogue bus compressor" autofocus>
    <button type="submit">Search</button>
  </div>
  <div class="facets">{{{facets}}}</div>
</form>
{{{summary}}}
<div class="columns">
<div class="results">{{{results}}}</div>
{{{more}}}
{{{pager}}}
{{{side}}}
{{{links}}}
</div>
