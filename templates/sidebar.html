<input type="checkbox" id="browse-toggle" class="browse-toggle">
<label for="browse-toggle" class="browse-button">Browse by category</label>
<nav class="side" aria-label="Browse the catalogue">
  <div class="side-group">
    <h2>Vendors</h2>
    <p class="side-more"><a href="/vendors">Everyone who makes a plugin here</a></p>
  </div>
  <div class="side-group">
    <h2>Formats</h2>
    <ul>{{{formats}}}</ul>
  </div>
  <div class="side-group">
    <h2>Categories</h2>
    <ul>{{{categories}}}</ul>
    <p class="side-more"><a href="/plugins">All {{total}} plugins</a></p>
  </div>
</nav>
