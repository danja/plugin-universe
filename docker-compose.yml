## Plugin Universe.
##
##   docker compose up -d                    store, embeddings and the app
##   docker compose --profile proxy up -d    the above plus nginx on 80/443
##
## Harvesting is a one-off command against the same image and the same volume:
##
##   docker compose run --rm app node bin/ingest.js
##   docker compose run --rm app node bin/discover.js --merge
##
## Secrets come from .env, which compose reads for substitution here and which
## .dockerignore keeps out of the image.
##
## ── Memory ──────────────────────────────────────────────────────────────────
##
## Sized to fit a 4 GB server. Every limit is overridable from .env, and the
## defaults are deliberately modest rather than comfortable.
##
## `memswap_limit` equal to `mem_limit` means *no swap for this container*, and
## that is the point of setting it. Swap is worth having on a small host, but
## not for these two processes: a JVM garbage collection walks the whole live
## heap, so a paged-out heap turns a GC into a disk I/O storm, and Ollama reads
## its model weights on every forward pass. Both must stay resident. Swap then
## does its real job — absorbing cold pages elsewhere on the system and keeping
## the OOM killer away from the store.
##
## (Docker needs cgroup v2, or `swapaccount=1` on a cgroup v1 kernel, to honour
## memswap_limit. If it cannot, it warns and ignores it rather than failing.)

services:
  fuseki:
    image: secoresearch/fuseki:latest
    container_name: plugin-universe-fuseki
    ports:
      # Bound to the loopback interface: the store is reached through the app
      # and through nginx, and a TDB2 update endpoint on a public port is not
      # something to expose by accident.
      - "127.0.0.1:${FUSEKI_PORT:-3030}:3030"
    environment:
      ADMIN_PASSWORD: ${SPARQL_PASSWORD:?SPARQL_PASSWORD must be set}
      ENABLE_DATA_WRITE: "true"
      ENABLE_UPDATE: "true"
      ENABLE_UPLOAD: "true"
      # TDB2 memory-maps its indexes and leans on the OS page cache, not the
      # Java heap, so a large -Xmx does not help it and takes memory the page
      # cache would use better. The catalogue is tens of thousands of triples;
      # 1g is already generous. Raise it only with a measurement in hand.
      JVM_ARGS: -Xmx${FUSEKI_HEAP:-1g}
    mem_limit: ${FUSEKI_MEM:-1400m}
    memswap_limit: ${FUSEKI_MEM:-1400m}
    volumes:
      # This image is secoresearch/fuseki: its base is /fuseki-base, not the
      # /fuseki that the official images use. A config mounted at the wrong
      # path is not an error — Fuseki simply never reads it, and the dataset
      # silently is not there.
      - fuseki-data:/fuseki-base/databases
      - ./config/fuseki/assembler-tdb2.ttl:/fuseki-base/configuration/plugin-universe.ttl:ro
    healthcheck:
      # wget, not curl: this image has no curl, and a healthcheck that can
      #  never pass makes every dependant fail with "dependency failed to
      # start" while the container itself is perfectly healthy.
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3030/$$/ping > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: plugin-universe-ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    environment:
      # Search embeds the query text, so this is a serving dependency and not
      # only a batch one. Keeping the model loaded costs a few hundred megabytes
      # and saves a reload on the first search after an idle spell; releasing it
      # is the trade for a smaller resident footprint overnight.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      # One small model, one request at a time. Both bound the memory this can
      # reach for, which matters more here than throughput.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    mem_limit: ${OLLAMA_MEM:-1600m}
    memswap_limit: ${OLLAMA_MEM:-1600m}
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  app:
    build: .
    container_name: plugin-universe-app
    ports:
      - "127.0.0.1:${APP_PORT:-4100}:4100"
    environment:
      # Service names, not localhost: inside the compose network these resolve
      # to the other containers. Set here rather than in .env because they are
      # deployment topology, not secrets.
      SPARQL_URL_BASE: http://fuseki:3030
      SPARQL_DATASET: ${SPARQL_DATASET:-plugin-universe}
      SPARQL_USER: ${SPARQL_USER:?SPARQL_USER must be set}
      SPARQL_PASSWORD: ${SPARQL_PASSWORD:?SPARQL_PASSWORD must be set}
      OLLAMA_URL: http://ollama:11434
      # Harvesting only. Absent is fine for serving.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      PORT: "4100"
      # Measured, not guessed: serving the full 645-plugin catalogue the
      # container sits at 48 MB resident, and stays there through a 40-request
      # concurrent burst. The working set is the document map and a few
      # megabytes of vector index. The old 2048 was copied from a larger
      # machine. 256 leaves five times the measured need.
      NODE_OPTIONS: --max-old-space-size=${NODE_HEAP:-256}
      # The seed repositories, when they are checked out on this machine.
      # Absent is fine: bin/ingest.js reports and skips a source with no
      # checkout rather than failing the run.
      DOWNSPOUT_PATH: /srv/seed/downspout
      FLUES_PATH: /srv/seed/flues
    # A little swap headroom here, unlike the store: Node's cold pages are
    # exactly what swap is good for, and a stall in the web tier is recoverable
    # in a way that a stalled garbage collector is not.
    mem_limit: ${APP_MEM:-384m}
    memswap_limit: ${APP_MEMSWAP:-640m}
    volumes:
      # The vector index and the harvest caches are state. They survive a
      # rebuild, and `docker compose run` shares them with the running service.
      - app-data:/app/data
      # Read-only bind mounts of the seed checkouts. ${SEED_DIR} defaults to a
      # directory that need not exist — Docker creates an empty one, and the
      # ingest then reports the source as skipped.
      - ${SEED_DIR:-./data/seed}:/srv/seed:ro
    depends_on:
      fuseki:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: plugin-universe-nginx
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/plugin-universe.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - certbot-webroot:/var/www/certbot:ro
    mem_limit: ${NGINX_MEM:-96m}
    depends_on:
      - app
    restart: unless-stopped

volumes:
  fuseki-data:
  ollama-models:
  app-data:
  certbot-webroot:
