# The public SPARQL endpoint.
#
# Proxies exactly one thing: the query operation of the `public` dataset, which
# is a separate TDB2 database loaded from bin/dump.js output. It is not a view
# of the catalogue — accounts and pending contributions were never loaded into
# it, rather than being filtered out of it.
#
# The dataset behind this has **no update operation defined**, so even if this
# file were widened by accident there is no write endpoint on `public` to reach.
# Loading happens through a second Fuseki service, `publication-admin`, which
# this file never mentions and which listens only on the loopback interface.
#
# Before enabling: certbot for sparql.plugin-universe.com, then
#   node bin/publish.js        on the server, to fill the dataset
#   node bin/publish.js --audit  to ask the endpoint what it actually holds

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sparql.plugin-universe.com;

    ssl_certificate     /etc/letsencrypt/live/sparql.plugin-universe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sparql.plugin-universe.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    # An open dataset is meant to be queried from a browser.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Accept" always;

    # A public endpoint is trivially abused: an unbounded query costs the server
    # far more than it costs whoever sent it. These are the cheap defences —
    # the recommended path for anything bulk is the dump, not this.
    limit_except GET POST OPTIONS { deny all; }
    client_max_body_size 64k;          # a query, not a payload
    proxy_read_timeout 30s;            # matches the Fuseki timeout below
    proxy_send_timeout 30s;

    location = /public/query {
        proxy_pass http://127.0.0.1:3030/public/query;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A bare visit should explain itself rather than 404.
    location = / {
        return 302 https://plugin-universe.com/about/sparql;
    }

    # Everything else, including every other Fuseki path, is not proxied at all.
    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name sparql.plugin-universe.com;
    location / { return 301 https://$host$request_uri; }
}
