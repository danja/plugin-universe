## plugin-universe.com for a shared host nginx.
##
## Use this one when nginx is installed on the server and already serves other
## sites — drop it in /etc/nginx/sites-available/plugin-universe.com and symlink
## it from sites-enabled/. Use plugin-universe.conf instead only for the
## dedicated nginx container in `docker compose --profile proxy`.
##
## The difference is not cosmetic. sites-enabled/* is included inside the
## http { } block, so anything at file scope here applies to *every* vhost on
## the machine. This file therefore:
##
##   - does not set `gzip on` — the Debian/Ubuntu nginx.conf already does, and a
##     second one is a duplicate-directive error, which is how you found this
##   - keeps proxy_set_header and gzip_types inside the server blocks, so they
##     cannot change how hyperdata.it or anything else behaves
##   - prefixes its limit_req_zone names, because zone names share one namespace
##     across the whole http context and "api" is a name someone else may want
##   - proxies to 127.0.0.1, because the compose file publishes the app and the
##     store on loopback; the service names `app` and `fuseki` only resolve from
##     inside the compose network
##
## Certificates are the certbot defaults. Adjust if yours live elsewhere.

# Rate limits. The API is open and CORS-open on purpose — a catalogue nobody can
# call from a browser is not much of an open dataset — so the limit is what
# keeps "open" from meaning "free to hammer".
limit_req_zone $binary_remote_addr zone=pu_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=pu_sparql:10m rate=2r/s;
# Search costs an embedding call, so it is metered separately from static pages.
limit_req_zone $binary_remote_addr zone=pu_search:10m rate=2r/s;

upstream plugin_universe_app {
    server 127.0.0.1:4100;
    keepalive 16;
}

upstream plugin_universe_store {
    server 127.0.0.1:3030;
    keepalive 4;
}

## ── ACME and the redirect to TLS ────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name plugin-universe.com www.plugin-universe.com api.plugin-universe.com
                sparql.plugin-universe.com mcp.plugin-universe.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

## ── The site ────────────────────────────────────────────────────────────────

server {
    # No http2 here, deliberately. HTTP/2 is a property of the listening
    # socket, not of a server block: whichever vhost on this machine enables it
    # for :443 enables it for all of them. Setting it here when another site
    # does not — or does — produces "protocol options redefined for 0.0.0.0:443"
    # and leaves the winner up to include order. Enable it once, in one file,
    # for the whole server.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name plugin-universe.com www.plugin-universe.com;

    ssl_certificate     /etc/letsencrypt/live/plugin-universe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plugin-universe.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Turtle and JSON-LD are highly repetitive and compress to a fraction of
    # their size. Scoped to this server so the rest of the machine keeps
    # whatever gzip policy it had.
    gzip_types text/plain text/css application/json application/ld+json
               text/turtle application/javascript application/n-triples;
    gzip_min_length 512;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    ## ── Files on disk ───────────────────────────────────────────────────────
    ##
    ## Pictures and dataset dumps are bytes. Paths are absolute here because
    ## nginx is on the machine rather than in a container with mounts. Streaming them through Node costs
    ## an event loop that has search to run, and nginx does this better than
    ## any application will — the same reasoning that keeps the dumps out of
    ## the app in docs/danja-todo.md.
    ##
    ## **`add_header` in a location replaces the ones inherited from the server
    ## block; it does not add to them.** So each block below repeats HSTS,
    ## nosniff and Referrer-Policy. Leaving them out is valid configuration
    ## that passes `nginx -t` and silently drops three security headers from
    ## every image on the site, which is exactly the kind of nginx mistake this
    ## project has made six times.

    # An uploaded picture. The name is a sha256 and an extension, and the regex
    # says so — so a traversal or a `.svg` never reaches the filesystem, on top
    # of src/api/ImageStore.js refusing to build such a path at all. Two checks
    # because this one is reachable without the app running.
    #
    # Immutable: the name is the hash of the content, so a different picture is
    # a different URL and this can never be stale.
    location ~ "^/image/([0-9a-f]{64}\.(?:png|jpg|gif|webp))$" {
        alias /home/github/plugin-universe/data/images/$1;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    # The dataset dumps. Browsable, because somebody arriving at /dumps/ wants
    # to see what is there before deciding what to fetch.
    #
    # The `types` block replaces the mime map for this location rather than
    # adding to it, so everything a dump contains has to be named here. Without
    # it every .ttl is served as application/octet-stream and a browser offers
    # to download the dataset description instead of showing it.
    location /dumps/ {
        alias /home/github/plugin-universe/data/dumps/;
        autoindex on;
        autoindex_exact_size off;
        types {
            text/turtle              ttl;
            application/ld+json      jsonld;
            application/n-triples    nt;
            application/json         json;
            text/markdown            md;
            text/plain               txt;
        }
        default_type application/octet-stream;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Access-Control-Allow-Origin "*" always;
        # A dump is rebuilt daily at most, and is large. An hour is long enough
        # to save the server work and short enough that a consumer polling for
        # a new one is not told a stale answer for a day.
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /search {
        limit_req zone=pu_search burst=10 nodelay;
        proxy_pass http://plugin_universe_app;
    }

    location / {
        limit_req zone=pu_api burst=40 nodelay;
        proxy_pass http://plugin_universe_app;
    }
}

## ── The REST API ────────────────────────────────────────────────────────────

server {
    # No http2 here, deliberately. HTTP/2 is a property of the listening
    # socket, not of a server block: whichever vhost on this machine enables it
    # for :443 enables it for all of them. Setting it here when another site
    # does not — or does — produces "protocol options redefined for 0.0.0.0:443"
    # and leaves the winner up to include order. Enable it once, in one file,
    # for the whole server.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.plugin-universe.com;

    ssl_certificate     /etc/letsencrypt/live/plugin-universe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plugin-universe.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip_types application/json application/ld+json text/turtle
               application/n-triples;
    gzip_min_length 512;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location = /search {
        limit_req zone=pu_search burst=10 nodelay;
        proxy_pass http://plugin_universe_app;
    }

    location / {
        limit_req zone=pu_api burst=40 nodelay;
        proxy_pass http://plugin_universe_app;
    }
}

## ── The public SPARQL endpoint ──────────────────────────────────────────────
##
## Read-only, and enforced here rather than trusted: only /query is proxied, so
## /update, /data and /upload are unreachable from the public name at all. That
## is the whole reason the store binds to loopback.
##
## Phase 5 turns this on; until then everything else answers 404.

# The public SPARQL endpoint used to be served from here, proxying to the live
# catalogue dataset — which exposed graph:system/accounts to anyone who asked
# for it by name. It now lives in deploy/nginx/sparql.plugin-universe.conf and
# serves a separate, published dataset that those graphs were never loaded into.
#
# Do not add a sparql. server block here again: two blocks claiming one name is
# a warning rather than an error, nginx keeps whichever it loaded first, and the
# one it keeps is decided by filename order.

