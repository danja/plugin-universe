## The second hop of the IRI indirection, on hyperdata.it.
##
## Plugin Universe mints IRIs under http://purl.org/stuff/plugin-universe/ and
## nothing is ever minted under the serving domain. Resolution is therefore two
## hops, and only the first is outside your control:
##
##   http://purl.org/stuff/plugin-universe/plugin/achord-0b1944d0
##     ── purl.org partial redirect on /stuff/ ─────────────────────►
##   https://hyperdata.it/xmlns/plugin-universe/plugin/achord-0b1944d0
##     ── this file ────────────────────────────────────────────────►
##   https://plugin-universe.com/plugin/achord-0b1944d0
##
## This arrangement is better than a single purl.org redirect would have been.
## purl.org holds one rule — /stuff/ to /xmlns/ — that never needs to change
## again, and every decision that might change lives here, on a server you
## administer. Moving the catalogue to another host is an edit to this file.
##
## Add these blocks to the existing hyperdata.it server block. They are scoped
## to /xmlns/plugin-universe/ and touch nothing else under /xmlns/.

# The namespace root is the ontology, not the site.
#
# An exact-match location, so it does not swallow the prefix rule below. A
# consumer that resolves the bare `pu:` prefix — which is what a reasoner does
# when it meets an unfamiliar term — gets the vocabulary document that defines
# the terms, rather than a search page.
location = /xmlns/plugin-universe/ {
    return 302 https://plugin-universe.com/ns/plugin-universe.ttl;
}

location = /xmlns/plugin-universe {
    return 302 https://plugin-universe.com/ns/plugin-universe.ttl;
}

# Everything else keeps its path: /plugin/…, /category/…, /vendor/…, and the
# .ttl and .jsonld suffixes, all of which the application already answers.
#
# 302, deliberately, and not 301. The whole purpose of minting under purl.org is
# that the serving host can change; a 301 is cached indefinitely by browsers and
# by every crawler that sees it, which would nail the IRIs to plugin-universe.com
# the price of being able to move.
location /xmlns/plugin-universe/ {
    rewrite ^/xmlns/plugin-universe/(.*)$ https://plugin-universe.com/$1 redirect;
}

## Note on the Accept header.
##
## Content negotiation survives this chain: a redirect does not consume the
## request, and every HTTP client resends Accept on the redirected request. So
## `curl -H "Accept: text/turtle" http://purl.org/stuff/plugin-universe/plugin/x`
## arrives at the application with the header intact and gets Turtle back.
## Verify that after any change here — it is the property that makes these IRIs
## linked data rather than links.
