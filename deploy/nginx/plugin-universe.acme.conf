## Stage one: port 80 only, for issuing the first certificate.
##
## nginx will not load a config whose ssl_certificate does not exist, and
## certbot's webroot method needs nginx already serving the challenge path.
## That is a genuine circle, and this file breaks it: install this alone, get
## the certificate, then replace it with plugin-universe.host.conf.
##
##   sudo cp plugin-universe.acme.conf /etc/nginx/sites-available/plugin-universe.com.conf
##   sudo ln -s /etc/nginx/sites-available/plugin-universe.com.conf /etc/nginx/sites-enabled/
##   sudo mkdir -p /var/www/certbot
##   sudo nginx -t && sudo systemctl reload nginx
##
##   sudo certbot certonly --webroot -w /var/www/certbot \
##        -d plugin-universe.com -d www.plugin-universe.com \
##        -d api.plugin-universe.com -d sparql.plugin-universe.com
##
##   sudo cp plugin-universe.host.conf /etc/nginx/sites-available/plugin-universe.com.conf
##   sudo nginx -t && sudo systemctl reload nginx
##
## No redirect to HTTPS yet — there is nothing to redirect to until the
## certificate exists, and a redirect to a port that refuses connections is
## harder to diagnose than a plain 404.

server {
    listen 80;
    listen [::]:80;
    server_name plugin-universe.com www.plugin-universe.com api.plugin-universe.com
                sparql.plugin-universe.com mcp.plugin-universe.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404 "plugin-universe.com is being set up.\n";
    }
}
