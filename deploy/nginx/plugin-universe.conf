## nginx for plugin-universe.com — the CONTAINER variant.
##
## For `docker compose --profile proxy`, where nginx has this machine to itself
## and this file is the only config it loads. It proxies to the compose service
## names, which resolve only inside that network.
##
## If nginx is already installed on the server and serving other sites, use
## plugin-universe.host.conf instead. Dropping this file into sites-enabled/
## fails on a duplicate `gzip` directive, and its http-level proxy_set_header
## and gzip_types would apply to every other vhost on the machine.
##
## Terminates TLS, compresses, rate-limits, and reverse-proxies to the app.
## The subdomain layout follows docs/architecture.md §11.
##
## Certificates are expected at /etc/nginx/certs/<domain>/{fullchain,privkey}.pem.
## See docs/deployment.md for issuing them; the ACME challenge path below is
## served from a shared volume so renewal does not need nginx to stop.

# Rate limits. The API is open and CORS-open on purpose — a catalogue nobody can
# call from a browser is not much of an open dataset — so the limit is what
# keeps "open" from meaning "free to hammer". Generous per client, bounded in
# aggregate.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=sparql:10m rate=2r/s;

# Search costs an embedding call, so it is metered separately from static pages.
limit_req_zone $binary_remote_addr zone=search:10m rate=2r/s;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

gzip on;
# text/html is always gzipped and listing it again is a warning, not an addition.
# The RDF types are the ones that matter here: a Turtle or JSON-LD response is
# highly repetitive and compresses to a fraction of its size.
gzip_types text/plain text/css application/json application/ld+json text/turtle
           application/javascript application/n-triples;
gzip_min_length 512;

upstream plugin_universe_app {
    server app:4100;
}

## ── ACME and the redirect to TLS ────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name plugin-universe.com www.plugin-universe.com api.plugin-universe.com
                sparql.plugin-universe.com mcp.plugin-universe.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

## ── The site ────────────────────────────────────────────────────────────────

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name plugin-universe.com www.plugin-universe.com;

    ssl_certificate     /etc/nginx/certs/plugin-universe.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/plugin-universe.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # A plugin IRI dereferences here. Content negotiation happens in the app,
    # so Accept must reach it intact and must be part of the cache key.
    proxy_set_header Accept $http_accept;

    location = /search {
        limit_req zone=search burst=10 nodelay;
        proxy_pass http://plugin_universe_app;
    }

    location / {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://plugin_universe_app;
    }
}

## ── The REST API ────────────────────────────────────────────────────────────

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.plugin-universe.com;

    ssl_certificate     /etc/nginx/certs/plugin-universe.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/plugin-universe.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /search {
        limit_req zone=search burst=10 nodelay;
        proxy_pass http://plugin_universe_app;
    }

    location / {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://plugin_universe_app;
    }
}

## ── The public SPARQL endpoint ──────────────────────────────────────────────
##
## Read-only, and enforced here rather than trusted: only /query is proxied, so
## /update, /data and /upload are not reachable from the public name at all.
## Phase 5 turns this on; until then it answers 404 like anything else.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sparql.plugin-universe.com;

    ssl_certificate     /etc/nginx/certs/plugin-universe.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/plugin-universe.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # A public query endpoint is a public compute endpoint. The rate limit is
    # the cheap protection; the timeout is what stops one clever query holding
    # a worker open indefinitely.
    location = /plugin-universe/query {
        limit_req zone=sparql burst=5 nodelay;
        proxy_read_timeout 30s;
        proxy_pass http://fuseki:3030/plugin-universe/query;
    }

    location / {
        return 404;
    }
}
