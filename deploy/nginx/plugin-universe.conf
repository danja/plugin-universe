## nginx for plugin-universe.com — the CONTAINER variant.
##
## For `docker compose --profile proxy`, where nginx has this machine to itself
## and this file is the only config it loads. It proxies to the compose service
## names, which resolve only inside that network.
##
## If nginx is already installed on the server and serving other sites, use
## plugin-universe.host.conf instead. Dropping this file into sites-enabled/
## fails on a duplicate `gzip` directive, and its http-level proxy_set_header
## and gzip_types would apply to every other vhost on the machine.
##
## Terminates TLS, compresses, rate-limits, and reverse-proxies to the app.
## The subdomain layout follows docs/architecture.md §11.
##
## Certificates are expected at /etc/nginx/certs/<domain>/{fullchain,privkey}.pem.
## See docs/deployment.md for issuing them; the ACME challenge path below is
## served from a shared volume so renewal does not need nginx to stop.

# Rate limits. The API is open and CORS-open on purpose — a catalogue nobody can
# call from a browser is not much of an open dataset — so the limit is what
# keeps "open" from meaning "free to hammer". Generous per client, bounded in
# aggregate.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=sparql:10m rate=2r/s;

# Search costs an embedding call, so it is metered separately from static pages.
limit_req_zone $binary_remote_addr zone=search:10m rate=2r/s;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

gzip on;
# text/html is always gzipped and listing it again is a warning, not an addition.
# The RDF types are the ones that matter here: a Turtle or JSON-LD response is
# highly repetitive and compresses to a fraction of its size.
gzip_types text/plain text/css application/json application/ld+json text/turtle
           application/javascript application/n-triples;
gzip_min_length 512;

upstream plugin_universe_app {
    server app:4100;
}

## ── ACME and the redirect to TLS ────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name plugin-universe.com www.plugin-universe.com api.plugin-universe.com
                sparql.plugin-universe.com mcp.plugin-universe.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

## ── The site ────────────────────────────────────────────────────────────────

server {
    # HTTP/2 via the listen option rather than the standalone `http2` directive.
    # The directive form needs nginx >= 1.25.1; this form works on every version
    # and only draws a deprecation warning on newer ones. Swap it for
    # `listen 443 ssl;` plus `http2 on;` once the server is past 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name plugin-universe.com www.plugin-universe.com;

    ssl_certificate     /etc/nginx/certs/plugin-universe.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/plugin-universe.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # A plugin IRI dereferences here. Content negotiation happens in the app,
    # so Accept must reach it intact and must be part of the cache key.
    proxy_set_header Accept $http_accept;


    ## ── Files on disk ───────────────────────────────────────────────────────
    ##
    ## Pictures and dataset dumps are bytes. Streaming them through Node costs
    ## an event loop that has search to run, and nginx does this better than
    ## any application will — the same reasoning that keeps the dumps out of
    ## the app in docs/danja-todo.md.
    ##
    ## **`add_header` in a location replaces the ones inherited from the server
    ## block; it does not add to them.** So each block below repeats HSTS,
    ## nosniff and Referrer-Policy. Leaving them out is valid configuration
    ## that passes `nginx -t` and silently drops three security headers from
    ## every image on the site, which is exactly the kind of nginx mistake this
    ## project has made six times.

    # An uploaded picture. The name is a sha256 and an extension, and the regex
    # says so — so a traversal or a `.svg` never reaches the filesystem, on top
    # of src/api/ImageStore.js refusing to build such a path at all. Two checks
    # because this one is reachable without the app running.
    #
    # Immutable: the name is the hash of the content, so a different picture is
    # a different URL and this can never be stale.
    location ~ "^/image/([0-9a-f]{64}\.(?:png|jpg|gif|webp))$" {
        alias /srv/images/$1;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    # The dataset dumps. Browsable, because somebody arriving at /dumps/ wants
    # to see what is there before deciding what to fetch.
    #
    # The `types` block replaces the mime map for this location rather than
    # adding to it, so everything a dump contains has to be named here. Without
    # it every .ttl is served as application/octet-stream and a browser offers
    # to download the dataset description instead of showing it.
    location /dumps/ {
        alias /srv/dumps/;
        autoindex on;
        autoindex_exact_size off;
        types {
            text/turtle              ttl;
            application/ld+json      jsonld;
            application/n-triples    nt;
            application/json         json;
            text/markdown            md;
            text/plain               txt;
        }
        default_type application/octet-stream;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Access-Control-Allow-Origin "*" always;
        # A dump is rebuilt daily at most, and is large. An hour is long enough
        # to save the server work and short enough that a consumer polling for
        # a new one is not told a stale answer for a day.
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /search {
        limit_req zone=search burst=10 nodelay;
        proxy_pass http://plugin_universe_app;
    }

    location / {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://plugin_universe_app;
    }
}

## ── The REST API ────────────────────────────────────────────────────────────

server {
    # HTTP/2 via the listen option rather than the standalone `http2` directive.
    # The directive form needs nginx >= 1.25.1; this form works on every version
    # and only draws a deprecation warning on newer ones. Swap it for
    # `listen 443 ssl;` plus `http2 on;` once the server is past 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.plugin-universe.com;

    ssl_certificate     /etc/nginx/certs/plugin-universe.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/plugin-universe.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /search {
        limit_req zone=search burst=10 nodelay;
        proxy_pass http://plugin_universe_app;
    }

    location / {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://plugin_universe_app;
    }
}

## ── The public SPARQL endpoint ──────────────────────────────────────────────
##
## Read-only, and enforced here rather than trusted: only /query is proxied, so
## /update, /data and /upload are not reachable from the public name at all.
## Phase 5 turns this on; until then it answers 404 like anything else.

# The public SPARQL endpoint used to be served from here, proxying to the live
# catalogue dataset — which exposed graph:system/accounts to anyone who asked
# for it by name. It now lives in deploy/nginx/sparql.plugin-universe.conf and
# serves a separate, published dataset that those graphs were never loaded into.
#
# Do not add a sparql. server block here again: two blocks claiming one name is
# a warning rather than an error, nginx keeps whichever it loaded first, and the
# one it keeps is decided by filename order.

