# The MCP endpoint, for agent access.
#
# Streamable HTTP, stateless: every call is a POST carrying JSON-RPC, and
# nothing is remembered between them. There is no SSE channel to keep open and
# no session to expire, which is why there is no long read timeout here.
#
# No port-80 block. plugin-universe.host.conf already has one listing every
# subdomain including this: it serves the ACME challenge path and redirects
# everything else to https. Two blocks claiming one name on one port is a
# *warning* rather than an error — nginx keeps whichever it loaded first — and
# a duplicate here would have broken certificate renewal quietly rather than
# loudly. One name, one block, per port.
#
# Before enabling: certbot for mcp.plugin-universe.com.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mcp.plugin-universe.com;

    ssl_certificate     /etc/letsencrypt/live/mcp.plugin-universe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.plugin-universe.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Agents run in browsers too.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Accept, Mcp-Session-Id, Mcp-Protocol-Version" always;

    client_max_body_size 256k;         # a tool call, not an upload
    proxy_read_timeout 60s;

    location = / {
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://plugin_universe_app/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Nothing is streamed, but buffering a JSON-RPC reply gains nothing and
        # delays the answer.
        proxy_buffering off;
    }

    # The same endpoint under its own name, since some clients expect a path.
    location = /mcp {
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://plugin_universe_app/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / { return 404; }
}
